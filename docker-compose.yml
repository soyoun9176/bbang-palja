name: kambodelight

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kambo
      POSTGRES_USER: kambo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kambo_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kambo -d kambo"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
  app:
    build: .
    environment:
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql://kambo:${POSTGRES_PASSWORD:-kambo_local_only}@db:5432/kambo
      STAFF_PASSWORD: ${STAFF_PASSWORD:-butter2026}
      DEMO_SEED: ${DEMO_SEED:-1}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
